# Spike S-7 phần 1 — HTTPRoute chuẩn + Middleware của Traefik qua ExtensionRef (ADR-002)
apiVersion: v1
kind: Namespace
metadata: {name: s7}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: whoami, namespace: s7}
spec:
  replicas: 1
  selector: {matchLabels: {app: whoami}}
  template:
    metadata: {labels: {app: whoami}}
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.11
          ports: [{containerPort: 80}]
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 32Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: whoami, namespace: s7}
spec:
  selector: {app: whoami}
  ports: [{port: 80, targetPort: 80}]
---
# Giả lập danh sách IP SePay: một dải KHÔNG chứa IP của máy → phải bị chặn
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: sepay-ips, namespace: s7}
spec:
  ipAllowList:
    sourceRange: ["203.0.113.0/24"]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: api-ratelimit, namespace: s7}
spec:
  rateLimit: {average: 2, burst: 3}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: webhook-sepay, namespace: s7}
spec:
  parentRefs: [{name: public, namespace: edge}]
  rules:
    - matches: [{path: {type: Exact, value: /webhooks/sepay}}]
      filters:
        - type: ExtensionRef
          extensionRef: {group: traefik.io, kind: Middleware, name: sepay-ips}
      backendRefs: [{name: whoami, port: 80}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: api, namespace: s7}
spec:
  parentRefs: [{name: public, namespace: edge}]
  rules:
    - matches: [{path: {type: PathPrefix, value: /api}}]
      filters:
        - type: ExtensionRef
          extensionRef: {group: traefik.io, kind: Middleware, name: api-ratelimit}
      backendRefs: [{name: whoami, port: 80}]
